<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <script src="script.js" defer></script>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .container{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sub-container{
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header{
            text-align: center;
        }

        .button-container{
            display: flex;
            justify-content: space-evenly;
            gap: 20px;
        }

        .score-container{
            display: flex;
            justify-content: space-evenly;
        }

        .choice-container{
            display: flex;
            justify-content: space-evenly;
        }

        button{
            font-size: 30px;
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sub-container">
            <div class="header"><h2>Select one of three choices</h2></div>
            <div class="button-container">
                <button class="rock">Rock</button>
                <button class="paper">Paper</button>
                <button class="scissors">Scissors</button>
            </div>
            <div class="choice-container">
                <p>Human Choice: <span class="humanChoice"></span></p>
                <p>Computer Choice: <span class="computerChoice"></span></p>
            </div>
            <div class="score-container">
                <p>Human Score: <span class="humanScore">0</span></p>
                <p>Computer Score: <span class="computerScore">0</span></p>
            </div>
            <p class="winner" style="text-align: center;"></p>
        </div>
    </div>
</body>
</html>
